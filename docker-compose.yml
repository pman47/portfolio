services:
  portfolio:
    image: ghcr.io/pman47/portfolio:latest
    container_name: portfolio
    ports:
      - "6969:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
