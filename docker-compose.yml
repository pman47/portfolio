services:
  portfolio:
    image: ghcr.io/pman47/portfolio:latest
    container_name: portfolio
    ports:
      - "6969:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web

networks:
  web:
    name: web
    external: true
