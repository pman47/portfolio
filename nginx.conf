server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Hashed assets: aggressive caching (1 year)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PDFs: always revalidate so resume updates show up immediately everywhere
    location ~* \.pdf$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Static assets in root (favicon, robots.txt, etc.)
    location ~* \.(svg|ico|txt|xml)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # HTML pages: short cache with revalidation
    location / {
        try_files $uri $uri/ /index.html;
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    error_page 404 /index.html;
}
